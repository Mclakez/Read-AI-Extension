<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ReadAI</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #1a1a2e;
        color: #e8e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 16px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      }

      header h1 {
        font-size: 15px;
        font-weight: 600;
        color: #fff;
      }

      #thread {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
        min-height: 200px;
      }

      .ai-bubble, .user-bubble {
        border-radius: 8px;
        padding: 10px 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .ai-bubble {
        background: rgba(255, 255, 255, 0.06);
        color: #e8e8f0;
      }

      .user-bubble {
        background: rgba(124, 106, 247, 0.12);
        border: 1px solid rgba(124, 106, 247, 0.25);
        color: #b8b0ff;
        align-self: flex-end;
      }

      #followup {
        display: flex;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
      }

      #input {
        flex: 1;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        color: #e8e8f0;
        outline: none;
      }

      #input:focus { border-color: #7c6af7; }

      #send {
        background: #7c6af7;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 14px;
      }

      #send:hover { background: #6a5ae0; }

      .hint {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ReadAI</h1>
    </header>
    <div id="thread"></div>
    <div id="followup">
      <input id="input" type="text" placeholder="Ask a follow-up..." />
      <button id="send">→</button>
    </div>
    <p class="hint">Shown in a separate window because Firefox blocks extensions inside the built-in PDF viewer.</p>
    <script src="result.js"></script>
  </body>
</html>
