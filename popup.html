<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 300px;
        padding: 20px;
        background: #1a1a2e;
        color: #e8e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
      }

      h2 {
        font-size: 16px;
        margin-bottom: 4px;
        color: #ffffff;
      }

      p {
        font-size: 12px;
        color: #ffffff70;
        margin-bottom: 16px;
        line-height: 1.5;
      }

      input {
        width: 100%;
        background: #ffffff10;
        border: 1px solid #ffffff20;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        color: #e8e8f0;
        margin-bottom: 12px;
        outline: none;
      }

      input:focus {
        border-color: #7c6af7;
      }

      button {
        width: 100%;
        background: #7c6af7;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #6a5ae0;
      }

      #status {
        margin-top: 12px;
        font-size: 12px;
        text-align: center;
        min-height: 16px;
        color: #7c6af7;
      }

      a#groq-link {
        color: #7c6af7;
        text-decoration: none;
        display: inline-block;
        margin-top: 4px;
      }
      
      a#groq-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h2>ReadAI Settings</h2>
    <p>
      Paste your Groq API key below. It's saved locally on your device only.
      Don't have a key? 
      <a href="https://console.groq.com" target="_blank" id="groq-link">
        Get one free at Groq →
      </a>
    </p>
    <input type="password" id="api-key-input" placeholder="gsk_..." />
    <button id="save-btn">Save Key</button>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
