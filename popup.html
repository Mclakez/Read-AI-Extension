<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 320px;
        padding: 16px;
        background: #1a1a2e;
        color: #e8e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
      }

      h2 {
        font-size: 15px;
        margin-bottom: 4px;
        color: #ffffff;
      }

      p {
        font-size: 12px;
        color: #ffffff70;
        margin-bottom: 12px;
        line-height: 1.5;
      }

      input {
        width: 100%;
        background: #ffffff10;
        border: 1px solid #ffffff20;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        color: #e8e8f0;
        margin-bottom: 10px;
        outline: none;
      }

      input:focus {
        border-color: #7c6af7;
      }

      button {
        width: 100%;
        background: #7c6af7;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #6a5ae0;
      }

      button.explain-action {
        margin-bottom: 12px;
        background: #7c6af7;
        font-weight: 600;
        font-size: 13px;
      }

      #status {
        margin-top: 8px;
        font-size: 12px;
        text-align: center;
        min-height: 16px;
        color: #7c6af7;
      }

      a#groq-link {
        color: #7c6af7;
        text-decoration: none;
      }

      .shortcut-hint {
        font-size: 10px;
        color: #ffffff40;
        margin-top: 12px;
        padding: 8px 10px;
        background: #ffffff08;
        border-radius: 6px;
        line-height: 1.4;
      }

      .shortcut-hint kbd {
        background: #ffffff15;
        padding: 1px 4px;
        border-radius: 3px;
        font-size: 10px;
        font-family: monospace;
        color: #e8e8f0;
      }
    </style>
  </head>
  <body>
    <h2>ReadAI</h2>
    <button id="explain-btn" class="explain-action">Explain selected text on this page</button>

    <input type="password" id="api-key-input" placeholder="Groq API key (gsk_...)" />
    <button id="save-btn">Save Key</button>
    <div id="status"></div>

    <div class="shortcut-hint">
      <kbd>Right‑click</kbd> &rarr; Explain with ReadAI &bull;
      On PDFs, results open in a ReadAI window (Firefox blocks page overlays)
    </div>

    <script src="popup.js"></script>
  </body>
</html>
